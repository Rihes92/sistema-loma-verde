<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mi Horario — SABIE</title>
<!-- sesión 26k (backlog crudo, punto 9): este módulo YA NO es autoservicio —
     ahora es de SOLO LECTURA. Coordinación arma y publica los horarios desde
     modulos/21-horarios-coordinacion.html (tabla lv_horarios, por docente).
     La vieja tabla lv_horario (por materia, con riesgo de choque entre
     docentes) queda sin usar, no se borra. -->
<style>
  :root{
    --primary:#1e3a8a; --primary-light:#3b82f6; --bg:#f1f5f9; --surface:#fff;
    --text:#1f2937; --muted:#475569; --border:#e2e8f0;
    --ok:#15803d; --bad:#dc2626; --warn:#b45309;
    --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  header.appbar{background:var(--primary);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header.appbar img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:#fff;padding:2px;flex-shrink:0}
  header.appbar h1{font-size:1.1rem;margin:0;font-weight:700;flex:1}
  header.appbar .pill{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;font-size:.78rem}
  header.appbar a.portal-btn{color:rgba(255,255,255,.85);text-decoration:none;display:flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;flex-shrink:0;border:1px solid rgba(255,255,255,.3);padding:5px 10px;border-radius:7px;margin-left:auto}
  header.appbar a.portal-btn:hover{background:rgba(255,255,255,.18);color:#fff}
  main{max-width:1200px;margin:0 auto;padding:18px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
  .card h2{margin:0 0 12px;font-size:1.05rem;color:var(--primary)}
  .desc{color:var(--muted);font-size:.85rem;margin-bottom:12px}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  button.btn{border:0;border-radius:8px;padding:9px 16px;font-size:.88rem;font-weight:600;cursor:pointer;background:var(--primary);color:#fff}
  button.btn.sec{background:#e2e8f0;color:var(--text)}
  button.btn:hover{filter:brightness(1.07)}

  .horario-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .horario-grid{display:grid;grid-template-columns:90px repeat(5,1fr);gap:3px;min-width:680px;align-items:stretch}
  .hg-head{background:var(--primary);color:#fff;font-size:.78rem;font-weight:700;text-align:center;padding:10px 6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .hg-head .dia-fecha{font-size:.68rem;opacity:.75;font-weight:400}
  .hg-hora{background:#f8fafc;border:1px solid var(--border);font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;padding:8px 4px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .hg-hora .h-num{font-size:1rem;font-weight:800;color:var(--primary)}
  .hg-celda{border:1px solid var(--border);border-radius:8px;padding:0;min-height:68px;position:relative;overflow:hidden;background:var(--surface)}
  .hg-celda.vacia{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#fff 6px,#fff 12px)}
  .celda-inner{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:8px 6px;text-align:center;background:#dbeafe;color:#1e3a8a}
  .celda-asig{font-size:.72rem;font-weight:800;letter-spacing:.01em;line-height:1.2}
  .celda-grado{font-size:.68rem;font-weight:600;opacity:.85}

  .stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .stat-pill{background:#f1f5f9;border:1px solid var(--border);border-radius:10px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;min-width:110px}
  .stat-pill .sp-n{font-size:1.5rem;font-weight:800;color:var(--primary)}
  .stat-pill .sp-l{font-size:.7rem;color:var(--muted);font-weight:600;text-align:center;margin-top:2px}

  @media(max-width:700px){main{padding:10px}}
  @media print{
    header.appbar,.no-print{display:none!important}
    body{background:#fff}.card{box-shadow:none;border:none;padding:0}
    .horario-grid{gap:2px}
  }
</style>
<link rel="stylesheet" href="../lv-tema.css">
</head>
<body>
<script src="../auth.js"></script>
<script>LV_AUTH.exigirSesion();</script>
<script>window.LV_SYNC_TABLAS=['lv_horarios','lv_docentes'];</script>
<script src="../sync.js"></script>

<header class="appbar">
  <img src="../Logo/logo.jpg" alt="Logo LV">
  <h1>🗓️ Mi Horario</h1>
  <span class="pill">SABIE</span>
  <a href="../index.html" class="portal-btn">← Portal</a>
</header>

<main>
  <div class="card no-print" id="card-info" style="display:none">
    <div class="stats-row" id="stats-row"></div>
    <button class="btn sec" onclick="window.print()">🖨️ Imprimir</button>
  </div>

  <div class="card" id="card-vacio" style="display:none">
    <div class="empty">🗓️ Coordinación todavía no ha publicado tu horario.<br>
      Cuando lo publique, aparecerá aquí automáticamente.</div>
  </div>

  <div class="card" id="card-grid" style="display:none;padding:12px">
    <div class="horario-wrap">
      <div class="horario-grid" id="horario-grid"></div>
    </div>
  </div>
</main>

<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lsRead(k){ try{ return JSON.parse(localStorage.getItem('lv_'+k))||[]; }catch(_){ return []; } }

const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes'];
const N_BLOQUES=7;
const BLOQUE_MIN=60;         // cada hora de clase dura 60 minutos
const DESCANSO_MIN=20;       // descanso de 20 minutos después de la 4ª hora
const DESCANSO_TRAS_BLOQUE=4; // índice 0-based del bloque DESPUÉS del cual va el descanso
function bloques(diaIdx){
  const h0=(diaIdx===0?8:7)*60;
  const out=[]; let t=h0;
  for(let i=0;i<N_BLOQUES;i++){
    if(i===DESCANSO_TRAS_BLOQUE) t+=DESCANSO_MIN;
    out.push({ini:fmtH(t), fin:fmtH(t+BLOQUE_MIN)});
    t+=BLOQUE_MIN;
  }
  return out;
}
function fmtH(m){return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}

function miHorario(){
  const login=LV_PERM.login();
  if(!login || !login.docenteId) return null;
  return lsRead('horarios').find(h=>h.id===login.docenteId) || null;
}

function renderGrilla(celdas){
  const grid=document.getElementById('horario-grid');
  grid.innerHTML='';

  const corner=document.createElement('div');
  corner.style.cssText='display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:6px 2px;border-radius:8px;background:#f8fafc;border:1px solid var(--border)';
  corner.textContent='Bloque';
  grid.appendChild(corner);

  DIAS.forEach((dia,di)=>{
    const bls=bloques(di);
    const el=document.createElement('div');
    el.className='hg-head';
    el.innerHTML=`<span>${dia}</span><span class="dia-fecha">${bls[0].ini}–${bls[N_BLOQUES-1].fin}</span>`;
    grid.appendChild(el);
  });

  for(let bi=0;bi<N_BLOQUES;bi++){
    const bLun=bloques(0)[bi];
    const hora=document.createElement('div');
    hora.className='hg-hora';
    hora.innerHTML=`<span class="h-num">${bi+1}</span><span>${bLun.ini}</span>`;
    grid.appendChild(hora);

    DIAS.forEach((_,di)=>{
      const val=((celdas[di]||{})[bi])||null;
      const cel=document.createElement('div');
      cel.className='hg-celda '+(val?'':'vacia');
      if(val){
        const inner=document.createElement('div');
        inner.className='celda-inner';
        inner.innerHTML=`<span class="celda-asig">${esc(val.materia||'')}</span>
          <span class="celda-grado">${esc(val.grado||'')}${val.grupo?'-'+esc(val.grupo):''}</span>
          ${val.aula?`<span style="font-size:.62rem;opacity:.75">${esc(val.aula)}</span>`:''}`;
        cel.appendChild(inner);
      }
      grid.appendChild(cel);
    });

    // Fila visual del descanso — no es un bloque real.
    if(bi===DESCANSO_TRAS_BLOQUE-1){
      const rec=document.createElement('div');
      rec.style.cssText='background:#fef3c7;border:1px solid #fde68a;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;font-size:.62rem;font-weight:700;color:#92400e';
      rec.innerHTML='<span>☕</span><span>Descanso</span>';
      grid.appendChild(rec);
      DIAS.forEach((_,di)=>{
        const bls=bloques(di);
        const desc=document.createElement('div');
        desc.style.cssText='background:repeating-linear-gradient(45deg,#fef9e7,#fef9e7 6px,#fffbeb 6px,#fffbeb 12px);border:1px dashed #f59e0b;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.66rem;color:#92400e;min-height:24px';
        desc.textContent=`${bls[DESCANSO_TRAS_BLOQUE-1].fin}–${bls[DESCANSO_TRAS_BLOQUE].ini} (20 min)`;
        grid.appendChild(desc);
      });
    }
  }
}

function renderStats(celdas){
  const c={}; let total=0;
  for(let di=0;di<5;di++) for(let bi=0;bi<N_BLOQUES;bi++){
    const v=(celdas[di]||{})[bi];
    if(v){ total++; const m=v.materia||'—'; c[m]=(c[m]||0)+1; }
  }
  const libre=5*N_BLOQUES-total;
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-pill"><span class="sp-n">${total}</span><span class="sp-l">Horas asignadas<br>(de 35)</span></div>
    <div class="stat-pill"><span class="sp-n" style="color:var(--muted)">${libre}</span><span class="sp-l">Horas libres</span></div>
    ${Object.entries(c).map(([m,n])=>`<div class="stat-pill"><span class="sp-n">${n}</span><span class="sp-l">${esc(m)}</span></div>`).join('')}
  `;
}

function init(){
  const h=miHorario();
  const celdas=h?(h.celdas||{}):{};
  const hayAlgo=Object.values(celdas).some(dia=>Object.keys(dia||{}).length>0);
  if(!hayAlgo){
    document.getElementById('card-vacio').style.display='block';
    document.getElementById('card-info').style.display='none';
    document.getElementById('card-grid').style.display='none';
    return;
  }
  document.getElementById('card-vacio').style.display='none';
  document.getElementById('card-info').style.display='block';
  document.getElementById('card-grid').style.display='block';
  renderStats(celdas);
  renderGrilla(celdas);
}
init();
setTimeout(init,2500);
</script>
</body>
</html>
